name: fakedata Release

on:
  push:
    tags:
      - "fakedata/v[0-9]+.[0-9]+.[0-9]+"
    paths:
      - "fakedata/**"
      - ".github/workflows/fakedata-release.yml"
      - "tools/go-release/**"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Release
        run: |
          go run ./tools/go-release \
            --tag-prefix fakedata/ \
            --tag ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --brew ./brew/FakeData/fakedata.rb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
