name: fakedata CI

on:
  push:
    branches: ["**"]
    paths:
      - "fakedata/**"
      - ".github/workflows/fakedata-*.yml"
  pull_request:
    branches: [main]
    paths:
      - "fakedata/**"
      - ".github/workflows/fakedata-*.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fakedata
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: fakedata

      - run: make test
