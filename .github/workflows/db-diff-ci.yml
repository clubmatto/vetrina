name: db-diff CI

on:
  push:
    branches: ["**"]
    paths:
      - "db-diff/**"
      - ".github/workflows/db-diff-*.yml"
  pull_request:
    branches: [main]
    paths:
      - "db-diff/**"
      - ".github/workflows/db-diff-*.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: db-diff
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - run: make lint

      - run: make unit

      # The integration suite starts containers with testcontainers, which the
      # hosted runner supports. It starts two containers per engine.
      - run: make integration
