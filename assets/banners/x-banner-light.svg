<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff006e" />
      <stop offset="25%" stop-color="#fb5607" />
      <stop offset="50%" stop-color="#ffbe0b" />
      <stop offset="75%" stop-color="#8338ec" />
      <stop offset="100%" stop-color="#3a86ff" />
    </linearGradient>

    <radialGradient id="blob1" cx="30%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ff006e" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ff006e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blob2" cx="70%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffbe0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffbe0b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blob3" cx="50%" cy="70%" r="80%">
      <stop offset="0%" stop-color="#3a86ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3a86ff" stop-opacity="0" />
    </radialGradient>

    <pattern id="diagonalLines" width="150" height="150" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="150" height="150" fill="none" />
      <line x1="60" y1="0" x2="60" y2="150" stroke="#8338ec" stroke-width="2" opacity="0.12" />
    </pattern>
  </defs>

  <rect width="1500" height="500" fill="#f8f8f8" />
  <rect width="1500" height="500" fill="url(#blob1)" />
  <rect width="1500" height="500" fill="url(#blob2)" />
  <rect width="1500" height="500" fill="url(#blob3)" />
  <rect width="1500" height="500" fill="url(#diagonalLines)" />

  <text x="750" y="225" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="140" font-weight="800" letter-spacing="-0.02em"
        fill="url(#textGradient)">
    Club Matto
  </text>
  <text x="750" y="305" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="32" font-weight="400" opacity="0.8"
        fill="#1a1a1a">
    The software bottega
  </text>
</svg>
