version: 2

project_name: fakedata

builds:
  -
    main: .
    binary: fakedata
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Env.VERSION }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Env.VERSION }}_{{ .Os }}_{{ .Arch }}"
    formats: tar.gz
    format_overrides:
      - goos: windows
        formats: zip

checksum:
  name_template: "{{ .ProjectName }}_{{ .Env.VERSION }}_checksums.txt"

release:
  github:
    owner: clubmatto
    name: vetrina
  header: |
    ## FakeData {{ .Tag }}

    Download the latest release for your platform.
  prerelease: auto


