version: 2

run:
  timeout: 5m

linters:
  default: fast
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - funlen
  disable:
    - depguard
    - wsl
    - testpackage

linters-settings:
  wsl_v5:
    allow-first-in-block: true
    allow-whole-block: false
    branch-max-lines: 2
  govet:
    checks:
      - all